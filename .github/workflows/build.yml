name: Build APK

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q personal-suite.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Uses a Gradle install instead of the wrapper, so it works before the wrapper is committed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
          build-root-directory: personal-suite

      - name: Build debug APK
        working-directory: personal-suite
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: suite-debug-apk
          path: personal-suite/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
