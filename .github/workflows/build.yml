
name: Build APK

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          [ -n "$ZIP" ] || { echo "No ZIP found"; exit 1; }

          DIR="./$(basename "${ZIP%.*}")"
          mkdir -p "$DIR"
          unzip -o "$ZIP" -d "$DIR"

          echo "EXTRACT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Locate Android project
        run: |
          PROJECT=$(find "$EXTRACT_DIR" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "No Gradle project found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: suite-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
