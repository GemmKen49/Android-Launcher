
name: Build APK

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract all ZIP files
        run: |
          find . -type f -name "*.zip" -not -path "./.git/*" | while IFS= read -r zipfile; do
            echo "Extracting: $zipfile"
            unzip -o "$zipfile" -d "$(dirname "$zipfile")"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Uses a Gradle install instead of the wrapper, so it works before the wrapper is committed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: suite-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
