name: Build APK

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP into respective directory
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          DIR="${ZIP%.zip}"
          DIR="${DIR%.ZIP}"

          mkdir -p "$DIR"
          unzip -o "$ZIP" -d "$DIR"

          echo "Extracted into: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Locate Android project
        run: |
          PROJECT=$(find "$PROJECT_DIR" -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building project at $PROJECT_DIR"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: suite-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
