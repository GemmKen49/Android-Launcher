name: Build APK

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q personal-suite.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Uses a Gradle install instead of the wrapper, so it works before the wrapper is committed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
          build-root-directory: personal-suite

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/suite.jks"
            echo "SUITE_KEYSTORE_PATH=$RUNNER_TEMP/suite.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set; using a throwaway debug key."
          fi

      - name: Build debug APK
        working-directory: personal-suite
        env:
          SUITE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SUITE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SUITE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: suite-debug-apk
          path: personal-suite/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
